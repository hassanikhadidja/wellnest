<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvelle inscription newsletter</title>
</head>
<body style="margin:0;padding:0;background:#F7F3EC;font-family:Arial,Helvetica,sans-serif;color:#2C2A26;">
  <!--
    EmailJS settings:
    - Name: Newsletter Notify (Admin)
    - Subject: Nouvelle inscription newsletter
    - To Email: wellnest.diet@gmail.com
    Variables: subscriber_email, source, to_email
  -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:28px 16px;background:#F7F3EC;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="background:#5C6B4A;padding:20px 24px;text-align:center;">
              <a href="https://wellnest-i92h.vercel.app/" style="text-decoration:none;">
                <img
                  src="https://res.cloudinary.com/tui0hpy4/image/upload/v1785690228/hi_28_gyqxuj.png"
                  alt="WELLNEST — بيت العافية"
                  width="110"
                  style="display:block;margin:0 auto;width:110px;max-width:50%;height:auto;border:0;"
                />
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:24px;">
              <p style="margin:0 0 4px;font-size:16px;font-weight:700;color:#2C2A26;">Nouvelle inscription</p>
              <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#5A564F;">
                Un nouvel abonné a rejoint la newsletter.
              </p>
              <table width="100%" style="font-size:14px;border-collapse:collapse;">
                <tr>
                  <td style="padding:8px 0;color:#8A857C;width:120px;">Email</td>
                  <td style="padding:8px 0;"><strong>{{subscriber_email}}</strong></td>
                </tr>
                <tr>
                  <td style="padding:8px 0;color:#8A857C;">Source</td>
                  <td style="padding:8px 0;">{{source}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background:#F7F3EC;text-align:center;font-size:11px;color:#8A857C;">
              Notification automatique ·
              <a href="https://wellnest-i92h.vercel.app/" style="color:#5C6B4A;text-decoration:none;">wellnest-i92h.vercel.app</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
